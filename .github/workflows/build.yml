name: Build Orbit Launcher

# Builds native installers for all three platforms:
#   Windows  -> NSIS installer (x64)
#   macOS    -> .app + .dmg for Apple Silicon (M1/M2/M3/M4)
#   Linux    -> .deb + .AppImage (most popular formats)
# Run it from the GitHub Actions tab (Run workflow) or by pushing a v* tag.
# Artifacts appear under the run once finished. macOS builds are unsigned —
# right-click -> Open the first time (Gatekeeper).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest # arm64 (Apple Silicon) runner
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build

      - name: Build (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Build (Linux deb + AppImage)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
